  </div>
</div>
<script>
(function(){
 const panel=document.getElementById('search-panel'),input=document.getElementById('search-input');
 document.getElementById('open-search').addEventListener('click',()=>{panel.classList.add('open');input.focus()});
 document.getElementById('close-search').addEventListener('click',()=>panel.classList.remove('open'));
 panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.remove('open')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open')});
 document.getElementById('search-form').addEventListener('submit',e=>{
   e.preventDefault();const q=input.value.replace(/\s/g,'').toLowerCase();
   const pages=[[/섬|바다|island/, 'islands.html'],[/갤러리|사진|photo/, 'gallery.html'],[/블로그|이야기|blog/, 'blog.html'],[/지도|gpx|map/, 'mountains-map.html'],[/영남|알프스/, 'yeongnam-alps.html'],[/해외|트래킹/, 'overseas-trekking.html'],[/여행|정보|기타|명산외/, 'other-hikes.html'],[/산|명산|mountain|bac/, 'mountains.html']];
   const target=pages.find(([re])=>re.test(q));if(target)location.href=target[1];else document.getElementById('search-feedback').textContent='해당 메뉴를 찾지 못했습니다. 아래 기록 메뉴에서 선택해 주세요.';
 });
})();
</script>
